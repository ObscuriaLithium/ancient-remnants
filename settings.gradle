pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
        maven {
            name = 'ObscuriaLocal'
            url = uri('/Users/obscuria/Modding/maven')
        }
        maven {
            name = 'Obscuria'
            url = 'https://raw.githubusercontent.com/ObscuriaLithium/modding/main/maven/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'ancient-remnants'
include('common')
include('fabric')
include('neoforge')
